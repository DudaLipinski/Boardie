  #             schema:
  #               $ref: '#/components/schemas/Error'
  /matches/{matchId}:
    get:
      summary: Get a match by id, along with its paticipants
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match to get
      responses:
        '200':
          description: A match with the given id was succesfully retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Match'
                properties:
                  participants:
                    type: array
                    items:
                      $ref: '#/components/schemas/HydratedMatchParticipant'
        '401':
          description: Invalid credentials
        '404':
          description: No match was found with the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    delete:
      summary: Deletes a match by id
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match to be deleted
      responses:
        '200':
          description: The match has been successfully deleted
        '401':
          description: Invalid credentials
        '403':
          description: You don't have the needed permissions to delete the match
        '404':
          description: No match was found with the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
