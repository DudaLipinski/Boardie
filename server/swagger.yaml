openapi: 3.0.0
info:
  version: 1.0.0
  title: Boardie
  description: API to serve the Boardie application
paths:
  /me:
    get:
      summary: Gets the logged user
      tags:
        - auth
      responses:
        '200':
          description: The user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationPayload'
      summary: Creates a user
      tags:
        - auth
      responses:
        '200':
          description: The created user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '400':
          description: Incorrect user format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists with given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/unregister:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth'
      summary: Unregisters the logged user
      tags:
        - auth
      responses:
        '200':
          description: User unregistered successfully
        '400':
          description: Incorrect auth format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
        '404':
          description: No user was found with the provided authentication
        '409':
          description: User already exists with given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/matches:
    get:
      summary: Get all matches on which the logged user participated
      tags:
        - matches
      responses:
        '200':
          description: The matches related to the given user
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Match'
                  properties:
                    participants:
                      type: array
                      items:
                        allOf:
                          - $ref: '#/components/schemas/HydratedMatchParticipant'
                        properties:
                          isWinner:
                            type: boolean
                  required:
                    - participants
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    post:
      summary: Creates a match for the logged user
      tags:
        - matches
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MatchBase'
              properties:
                participants:
                  type: array
                  items:
                    $ref: '#/components/schemas/MatchParticipantBase'
      responses:
        '200':
          description: The match was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Incorrect match format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/friends:
    get:
      summary: Returns all the logged user's friends, including anonymous ones
      tags:
        - friends
      responses:
        '200':
          description: The friends related to the given user
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/GenericFriend'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/anonfriends:
    post:
      summary: Creates an anonymous friend for the logged user
      tags:
        - friends
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AnonFriendBase'
      responses:
        '200':
          description: The anonymous friend was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonFriend'
        '400':
          description: Incorrect anonymous friend format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
