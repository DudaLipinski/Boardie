  #       '500':
  #         description: Unexpected internal error
  #         content:
  #           application/json:
  #             schema:
  #               $ref: '#/components/schemas/Error'
  # /friendship-request/{friendshipRequestId}/decline:
  #   post:
  #     summary: Decline friendship request
  #     parameters:
  #       - in: path
