components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserBase:
      title: User base data
      description: Information that define an user
      type: object
      properties:
        firstName:
          type: string
        middleAndSurname:
          type: string
        email:
          type: string
        age:
          type: integer
          minimum: 1
          maximum: 120
      required:
        - firstName
        - middleAndSurname
        - age
        - email
      additionalProperties: false
    UserInfo:
      title: User
      description: User information
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBase'
      properties:
        id:
          type: number
          minimum: 1
      required:
        - id
      additionalProperties: false
    UserCreationPayload:
      title: UserCreationPayload
      description: Data to create a user
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBase'
      properties:
        password:
          type: string
      required:
        - password
      additionalProperties: false
    GenericFriend:
      title: Generic friend data
      description: Data that can represent an anonymous or registered friend
      type: object
      properties:
        id:
          type: number
          example: 123
        fullName:
          type: string
          example: Meeple Catanicus
        # avatar:
        #   type: string
        isAnonymous:
          type: boolean
      additionalProperties: false
    AnonFriendBase:
      title: Anonymous friend base data
      description: Base data for creating an anonymous friend
      type: object
      properties:
        fullName:
          type: string
          example: Meeple Catanicus
      required:
        - fullName
      additionalProperties: false
    AnonFriend:
      title: AnonFriend
      description: An existent anonymous friend's data
      type: object
      allOf:
        - $ref: '#/components/schemas/AnonFriendBase'
      properties:
        id:
          type: string
          example: 123e4567-e89b-12d3-a456-426614174000
      required:
        - id
      additionalProperties: false
    # FriendshipRequestBase:
    #   title: Friendship request base data
    #   description: Information that define a friendship request
    #   type: object
    #   properties:
    #     requestingUserId:
    #       type: string
    #     requestedUserId:
    #       type: string
    #   required:
    #     - requestingUserId
    #     - requestedUserId
    #   additionalProperties: false
    # FriendshipRequestInfo:
    #   title: Friendship request info
    #   description: Existent friendship request info
    #   type: object
    #   allOf:
    #     - $ref: '#/components/schemas/FriendshipRequestBase'
    #   properties:
    #     id:
    #       type: string
    #   required:
    #     - id
    #   additionalProperties: false
    Auth:
      title: Auth
      description: Data to authenticate a user
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      additionalProperties: false
    MatchBase:
      title: Match base
      description: Match base data
      type: object
      properties:
        boardgameName:
          type: string
          description: (temporary) name of the boardgame
          example: Everdell
        date:
          type: string
          description: Date when the match took place, in UTC
          example: 2022-17-10 16:30
          nullable: true
        duration:
          type: integer
          description: The amount of seconds that the match took
          example: 3600
          nullable: true
        notes:
          type: string
          description: Further details about the match
          example: In this Everdell match, Kresh won by being the master of pigeons
          nullable: true
        # boardgameId:
        #   type: number
        #   description: id of boardgame registered at boardgamegeek api (https://boardgamegeek.com/boardgame/\<boardgameId\>)
        #   example: 174430
        # winnerUserId:
        #   type: integer
        #   description: The id of the user who won the match
        #   example: 13872
      required:
        - authorId
        - boardgameName
    Match:
      title: Match
      description: Full match data, with its registered id
      type: object
      allOf:
        - $ref: '#/components/schemas/MatchBase'
      properties:
        id:
          type: integer
          description: id of the registered match
          example: 14902
      required:
        - id
      additionalProperties: false
    MatchParticipantBase:
      title: Match participant base
      description: Relationship between a match and participant, along with his score and notes on that specific match
      type: object
      properties:
        # userId:
        #   type: integer
        #   description: id of the user who participated on the match
        #   example: 13803
        # unregisteredFriendId:
        #   type: integer
        #   description: id of the unregistered friend who participated in the match
        #   example: 13803
        fullName: # --- TEMPORARY
          type: string
          description: (temporary) full name of the participant
          example: Maria Lipânska
        score:
          type: number
          description: Score that the user achieved on the match
          example: 50
        # notes:
        #   type: string
        #   description: Further details related to the user's perfomance on the match
        #   example: Maria was able to increase her titanium production in the beginning, which snowballed her Terraforming mars company that was increase each of her titanium worth one more MC
      required:
        - fullName
        - score
    HydratedMatchParticipant:
      title: Match participant base
      description: Relationship between a match and participant, along with his score and notes on that specific match
      type: object
      allOf:
        - $ref: '#/components/schemas/MatchParticipantBase'
      properties:
        fullName:
          type: string
          description: Full name of the user/unregistered friend
          example: Guilherme Tatibana
      required:
        - fullName
    Error:
      type: object
      required:
        - message
      properties:
        message:
          description: A human readable error message
          type: string
    InternalError:
      type: object
      required:
        - ref
      properties:
        ref:
          description: A reference for the internal error that occurred. Can be used to retrieve details through logs
          type: string
security:
  - BearerAuth: []
