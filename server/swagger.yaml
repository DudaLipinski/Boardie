openapi: 3.0.0
info:
  version: 1.0.0
  title: Boardie
  description: API to serve the Boardie application
paths:
  /me:
    get:
      summary: Gets the logged user
      tags:
        - auth
      responses:
        '200':
          description: The user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreationDTO'
      summary: Creates a user
      tags:
        - auth
      responses:
        '201':
          description: The created user's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Incorrect user format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists with given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/unregister:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth'
      summary: Unregisters the logged user
      tags:
        - auth
      responses:
        '200':
          description: User unregistered successfully
        '400':
          description: Incorrect auth format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
        '404':
          description: No user was found with the provided authentication
        '409':
          description: User already exists with given email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/matches:
    get:
      summary: Get all matches on which the logged user participated
      tags:
        - matches
      responses:
        '200':
          description: The matches related to the given user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchWithParticipants'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    post:
      summary: Creates a match for the logged user
      tags:
        - matches
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchCreationDTO'
      responses:
        '201':
          description: The match was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Match'
        '400':
          description: Incorrect match format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/friends:
    get:
      summary: Returns all the logged user's friends, including anonymous ones
      tags:
        - friends
      responses:
        '200':
          description: The friends related to the given user
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/HydratedGenericFriend'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /me/anonfriends:
    post:
      summary: Creates an anonymous friend for the logged user
      tags:
        - friends
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/AnonFriendBase'
      responses:
        '201':
          description: The anonymous friend was successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnonFriend'
        '400':
          description: Incorrect anonymous friend format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /auth:
    post:
      summary: Log in with user
      tags:
        - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth'
      responses:
        '200':
          description: The logged in user's data along with the generated JWT token
          content:
            application/json:
              schema:
                properties:
                  user:
                    allOf:
                      - $ref: '#/components/schemas/User'
                  token:
                    type: string
                    description: JWT token
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOjEsImlhdCI6MTY2NjUyMTc4MCwiZXhwIjoxNjY2NTQzMzgwfQ.MDwMf43KJDUspoelvhst3FrzWdxaFzmowZ80alZERVQ
        '401':
          description: Provided credentials doesn't match any valid user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /matches/{matchId}:
    get:
      summary: Get a match by id, along with its paticipants
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match to get
      responses:
        '200':
          description: A match with the given id was succesfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchWithParticipants'
        '401':
          description: Invalid credentials
        '404':
          description: No match was found with the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    put:
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match to update
      summary: Update some match's details
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/MatchBase'
      responses:
        '200':
          description: The match has been successfully updated
        '401':
          description: Invalid credentials
        '403':
          description: You don't have the needed permissions to update the match
        '404':
          description: No match was found with the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    delete:
      summary: Deletes a match by id
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match to be deleted
      responses:
        '200':
          description: The match has been successfully deleted
        '401':
          description: Invalid credentials
        '403':
          description: You don't have the needed permissions to delete the match
        '404':
          description: No match was found with the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /matches/{matchId}/participants:
    get:
      summary: Get all the match participants related to a given match
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match to get the participants from
      responses:
        '200':
          description: The participants for the given match were successfully retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MatchParticipant'
        '401':
          description: Invalid credentials
        '404':
          description: No match was found with the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    post:
      summary: Create a match participant
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match with which the participant will be related
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchParticipantBase'
      responses:
        '200':
          description: The create participant's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchParticipant'
        '401':
          description: Provided credentials doesn't match any valid user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user doesn't have permissions to update the match, or doesn't have a friendship with the friend related to the match participant trying to be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No match was found with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /matches/{matchId}/participants/{participantId}:
    put:
      summary: Update a match participant
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match that contains the participant
        - in: path
          name: participantId
          schema:
            type: integer
          required: true
          description: id of the match participant to be updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchParticipantBase'
      responses:
        '200':
          description: The updated participant's data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchParticipant'
        '401':
          description: Provided credentials doesn't match any valid user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: The user doesn't have permissions to update the match, or doesn't have a friendship with the friend related to the match participant trying to be inserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No match was found with the given id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
    delete:
      summary: Permanently deletes a match participant
      tags:
        - matches
      parameters:
        - in: path
          name: matchId
          schema:
            type: integer
          required: true
          description: id of the match that contains the participant to be deleted
        - in: path
          name: participantId
          schema:
            type: integer
          required: true
          description: id of the match participant to be deleted
      responses:
        '200':
          description: The participant was successfully deleted
        '400':
          description: Invalid request
        '403':
          description: The user doesn't have permissions to update the match
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No match or match participant was found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    UserBase:
      title: User base data
      description: Information that define an user
      type: object
      properties:
        firstName:
          type: string
        middleAndSurname:
          type: string
        email:
          type: string
        age:
          type: integer
          minimum: 1
          maximum: 120
      required:
        - firstName
        - middleAndSurname
        - age
        - email
      additionalProperties: false
    User:
      title: User
      description: User information
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBase'
      properties:
        id:
          type: number
          minimum: 1
      required:
        - id
      additionalProperties: false
    UserCreationDTO:
      title: UserCreationDTO
      description: Data to create a user
      type: object
      allOf:
        - $ref: '#/components/schemas/UserBase'
      properties:
        password:
          type: string
      required:
        - password
      additionalProperties: false
    Auth:
      title: Auth
      description: Data to authenticate a user
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
      additionalProperties: false
    GenericFriend:
      title: Generic friend data
      description: Data that can represent an anonymous or registered friend
      type: object
      properties:
        id:
          type: number
          example: 123
        # avatar:
        #   type: string
        type:
          type: string
          enum: [ANON_FRIEND, USER]
          description: type of the friend's user registration
      required:
        - id
        - type
    HydratedGenericFriend:
      title: Hydrated generic friend
      description: Data that can represent an anonymous or registered friend, with the full name
      type: object
      allOf:
        - $ref: '#/components/schemas/GenericFriend'
      properties:
        fullName:
          type: string
          example: Meeple Catanicus
        # avatar:
        #   type: string
      additionalProperties: false
      required:
        - fullName
    AnonFriendBase:
      title: Anonymous friend base data
      description: Base data for creating an anonymous friend
      type: object
      properties:
        fullName:
          type: string
          example: Meeple Catanicus
      required:
        - fullName
      additionalProperties: false
    AnonFriend:
      title: AnonFriend
      description: An existent anonymous friend's data
      type: object
      allOf:
        - $ref: '#/components/schemas/AnonFriendBase'
      properties:
        id:
          type: number
          example: 1
        type:
          type: string
          enum: [ANON_FRIEND]
      required:
        - id
        - type
      additionalProperties: false
    MatchBase:
      title: Match base
      description: Match base data
      type: object
      properties:
        boardgameName:
          type: string
          description: (temporary) Name of the boardgame
          example: Everdell
        startedAt:
          type: string
          description: Date and time when the match started, in ISO 8601 and UTC
          example: 2019-11-14T00:55:31.820Z
          nullable: true
        endedAt:
          type: string
          description: Date and time when the match ended, in ISO 8601 and UTC
          example: 2019-11-14T00:55:31.820Z
          nullable: true
        notes:
          type: string
          description: Further details about the match
          example: In this Everdell match, Kresh won by being the master of pigeons
          nullable: true
        # boardgameId:
        #   type: number
        #   description: id of boardgame registered at boardgamegeek api (https://boardgamegeek.com/boardgame/\<boardgameId\>)
        #   example: 174430
      required:
        - boardgameName
    MatchCreationDTO:
      title: Match creation DTO
      description: Data used to create a match
      type: object
      allOf:
        - $ref: '#/components/schemas/MatchBase'
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/MatchParticipantBase'
      required:
        - participants
    Match:
      title: Match
      description: Match data, with its registered id
      type: object
      allOf:
        - $ref: '#/components/schemas/MatchBase'
      properties:
        id:
          type: integer
          description: id of the registered match
          example: 14902
      required:
        - id
      additionalProperties: false
    MatchParticipantBase:
      title: Match participant base
      description: Relationship between a match and participant, along with his score and notes on that specific match
      type: object
      properties:
        friend:
          $ref: '#/components/schemas/GenericFriend'
        score:
          type: number
          description: Score that the user achieved on the match
          example: 50
        isWinner:
          type: boolean
          description: If the user was a winner or not
          example: true
        # notes:
        #   type: string
        #   description: Further details related to the user's perfomance on the match
        #   example: Maria was able to increase her titanium production in the beginning, which snowballed her Terraforming mars company that was increase each of her titanium worth one more MC
      required:
        - id
        - friend
        - score
    MatchParticipant:
      title: Match participant
      description: Relationship between a match and participant, along with his score and notes on that specific match
      type: object
      allOf:
        - $ref: '#/components/schemas/MatchParticipantBase'
      properties:
        id:
          type: integer
          description: id of the participant record
          example: 13803
        friend:
          type: object
          allOf:
            - $ref: '#/components/schemas/HydratedGenericFriend'
      required:
        - friend
    MatchWithParticipants:
      title: Match with participnats
      description: The match description, along with its participants
      type: object
      allOf:
        - $ref: '#/components/schemas/Match'
      properties:
        participants:
          type: array
          items:
            $ref: '#/components/schemas/MatchParticipant'
    Error:
      type: object
      required:
        - message
      properties:
        message:
          description: A human readable error message
          type: string
    InternalError:
      type: object
      required:
        - ref
      properties:
        ref:
          description: A reference for the internal error that occurred. Can be used to retrieve details through logs
          type: string
security:
